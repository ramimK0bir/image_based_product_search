<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Product Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .1);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 24px;
        }

        label {
            font-size: .85rem;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        input[type=text], input[type=file] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: .95rem;
            margin-bottom: 16px;
        }

        .divider {
            text-align: center;
            color: #aaa;
            margin-bottom: 16px;
            font-size: .85rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        #error {
            color: #dc2626;
            margin-top: 16px;
            font-size: .9rem;
        }

        #results {
            margin-top: 24px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 500;
        }

        .conf {
            color: #6b7280;
            font-size: .85rem;
            margin: 0 12px;
        }

        .search-link {
            font-size: .85rem;
            color: #2563eb;
            text-decoration: none;
            white-space: nowrap;
        }

        .search-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🔍 Image Product Search</h1>
    <form id="form">
        {% csrf_token %}

        <label>Upload Image</label>

        <input
                type="file"
                name="image"
                id="file-input"
                accept="image/*"
        >

        <!-- preview image -->
        <img
                id="preview"
                style="
            display:none;
            width:250px;
            margin-top:15px;
            border-radius:10px;
        "
        >

        <button type="submit" id="btn">Predict</button>
    </form>

    <script>
        const fileInput = document.getElementById("file-input");
        const preview = document.getElementById("preview");

        fileInput.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) return;

            // create temporary image URL
            const imageURL = URL.createObjectURL(file);

            // show preview
            preview.src = imageURL;
            preview.style.display = "block";
        });
    </script>
    <div id="error"></div>
    <div id="results"></div>
</div>

<script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const errorDiv = document.getElementById("error");
    const resultsDiv = document.getElementById("results");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorDiv.textContent = "";
        resultsDiv.innerHTML = "";
        btn.disabled = true;
        btn.textContent = "Predicting...";

        const data = new FormData(form);
        try {
            const resp = await fetch("/", {method: "POST", body: data});
            const json = await resp.json();

            if (!resp.ok) {
                errorDiv.textContent = json.error;
                if (resp.status === 429) btn.textContent = json.error;
                else btn.textContent = "Predict";
                btn.disabled = resp.status === 429;
                return;
            }

            json.results.forEach(({label, confidence, search_url}) => {
                resultsDiv.innerHTML += `
          <div class="result-item">
            <span class="label">${label}</span>
            <span class="conf">${confidence}%</span>
            <a class="search-link" href="${search_url}" target="_blank">Search on Google →</a>
          </div>`;
            });
        } catch {
            errorDiv.textContent = "Something went wrong.";
        } finally {
            btn.disabled = false;
            btn.textContent = "Predict";
        }
    });
</script>
</body>
</html>
